services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecologistica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecologistica}
      POSTGRES_DB: ${POSTGRES_DB:-ecologistica}
    ports:
      # 5433 en el host evita el choque con otro PostgreSQL local en 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecologistica} -d ${POSTGRES_DB:-ecologistica}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ecologistica}:${POSTGRES_PASSWORD:-ecologistica}@db:5432/${POSTGRES_DB:-ecologistica}
      REDIS_URL: redis://redis:6379/0
      SEED_ON_STARTUP: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Proceso aparte del request de FastAPI (C4: motor de optimización).
  worker:
    build: ./backend
    entrypoint: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ecologistica}:${POSTGRES_PASSWORD:-ecologistica}@db:5432/${POSTGRES_DB:-ecologistica}
      REDIS_URL: redis://redis:6379/0
      SEED_ON_STARTUP: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      # Solo para depurar desde el host. La API y el worker usan el nombre redis.
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
