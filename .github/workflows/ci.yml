name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ecologistica
          POSTGRES_PASSWORD: ecologistica
          POSTGRES_DB: ecologistica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecologistica -d ecologistica_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ecologistica:ecologistica@localhost:5432/ecologistica_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        working-directory: backend
        run: ruff check app tests
      - name: Pytest
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar, probar y compilar
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
