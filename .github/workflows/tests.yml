name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Pruebas unitarias del backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ecologistica
          POSTGRES_PASSWORD: ecologistica
          POSTGRES_DB: ecologistica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecologistica -d ecologistica_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ecologistica:ecologistica@localhost:5432/ecologistica_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Pytest
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Pruebas unitarias del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Vitest
        working-directory: frontend
        run: npm test

  integracion:
    name: Pruebas de integración de la API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ecologistica
          POSTGRES_PASSWORD: ecologistica
          POSTGRES_DB: ecologistica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecologistica -d ecologistica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://ecologistica:ecologistica@127.0.0.1:5432/ecologistica
      JWT_SECRET: ci-integracion-secret
      SEED_ON_STARTUP: "true"
      SEED_ADMIN_EMAIL: admin@distrirapido.example.com
      SEED_ADMIN_PASSWORD: AdminDemo1
      SEED_OPERADOR_EMAIL: operador@distrirapido.example.com
      SEED_OPERADOR_PASSWORD: OperadorDemo1
      SEED_GERENTE_EMAIL: gerente@distrirapido.example.com
      SEED_GERENTE_PASSWORD: GerenteDemo1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Migrar y sembrar
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.seed
      - name: Arrancar la API
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn-integracion.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "La API no respondió" >&2
          cat /tmp/uvicorn-integracion.log >&2
          exit 1
      - name: Comprobar salud, login, listado y 422
        working-directory: backend
        run: python scripts/comprobar_integracion.py

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ecologistica
          POSTGRES_PASSWORD: ecologistica
          POSTGRES_DB: ecologistica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecologistica -d ecologistica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://ecologistica:ecologistica@127.0.0.1:5432/ecologistica
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-e2e-secret
      SEED_ON_STARTUP: "true"
      SEED_ADMIN_EMAIL: admin@distrirapido.example.com
      SEED_ADMIN_PASSWORD: AdminDemo1
      SEED_OPERADOR_EMAIL: operador@distrirapido.example.com
      SEED_OPERADOR_PASSWORD: OperadorDemo1
      SEED_GERENTE_EMAIL: gerente@distrirapido.example.com
      SEED_GERENTE_PASSWORD: GerenteDemo1
      SEED_CONDUCTOR_EMAIL: conductor@distrirapido.example.com
      SEED_CONDUCTOR_PASSWORD: ConductorDemo1
      CORS_ORIGINS: http://127.0.0.1:4173
      VITE_PROXY_TARGET: http://127.0.0.1:8000
      E2E_ADMIN_EMAIL: admin@distrirapido.example.com
      E2E_ADMIN_PASSWORD: AdminDemo1
      E2E_CONDUCTOR_EMAIL: conductor@distrirapido.example.com
      E2E_CONDUCTOR_PASSWORD: ConductorDemo1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar la API
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Instalar el frontend
        working-directory: frontend
        run: npm ci
      - name: Instalar navegadores de Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Migrar, sembrar y arrancar API y worker
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.seed
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn-e2e.log 2>&1 &
          python -m app.worker > /tmp/worker-e2e.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "La API no respondió" >&2
          cat /tmp/uvicorn-e2e.log >&2
          exit 1
      - name: Playwright (Chromium, Firefox y WebKit)
        working-directory: frontend
        run: npx playwright test
      - name: Publicar el informe HTML y los resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: warn
