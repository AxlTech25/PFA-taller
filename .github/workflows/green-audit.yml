name: Green IT audit

on:
  push:
  pull_request:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ecologistica
          POSTGRES_PASSWORD: ecologistica
          POSTGRES_DB: ecologistica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecologistica -d ecologistica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://ecologistica:ecologistica@127.0.0.1:5432/ecologistica
      JWT_SECRET: ci-test-secret
      AUDITORIA_PASSWORD: clave-segura
      LHCI_ADMIN_EMAIL: admin.lhci@distrirapido.example.com
      LHCI_CONDUCTOR_EMAIL: conductor.lhci@distrirapido.example.com
      API_UPSTREAM: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Migrar la base y sembrar la auditoría
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          alembic upgrade head
          python scripts/semilla_auditoria.py
      - name: Arrancar la API
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn-lhci.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "La API no respondió" >&2
          cat /tmp/uvicorn-lhci.log >&2
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar el frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Auditoría Lighthouse CI
        run: |
          if ! command -v google-chrome-stable >/dev/null; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
          npm install -g @lhci/cli@0.14.0
          lhci autorun --config=./lighthouserc.cjs
