[project]
name = "ecologistica-api"
version = "1.0.0"
description = "API EcoLogística Lima — Sprint 1"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["app", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402", "I001"]

[tool.coverage.run]
omit = ["app/seed.py"]
source = ["app"]
