sonar.projectKey=pfa-taller
sonar.projectName=EcoLogística Lima
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

sonar.sources=backend/app,frontend/src
sonar.exclusions=backend/tests/**,backend/alembic/**,backend/app/seed.py,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

# Los reportes salen con rutas relativas a la raíz del repositorio
# (backend/app/... y frontend/src/...), siempre con barras /.
# El escáner en Docker monta el repo en /usr/src y las resuelve tal cual:
# no hace falta reescribir <source> de coverage.xml antes de analizar.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
